name: Migration Source Snapshot
on:
  push:
    branches: [supabase-migration]
    paths:
      - '.github/workflows/repo-snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository
        run: zip -qr give-a-gallon-source.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: give-a-gallon-source
          path: give-a-gallon-source.zip
