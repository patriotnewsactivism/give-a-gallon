name: Delete temporary Convex backup artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-sensitive-artifact.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10475959497"
