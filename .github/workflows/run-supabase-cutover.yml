name: Clean Supabase migration branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-supabase-cutover.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove remaining Convex-only files
        shell: bash
        run: |
          rm -rf .agents/skills/convex .agents/skills/mike-convex-thumbnail
          rm -rf .claude/skills/convex .claude/skills/mike-convex-thumbnail
          rm -f .github/workflows/convex-export.yml
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Give a Gallon migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
          else
            git commit -m "Remove remaining Convex-only project files"
            git push origin HEAD:supabase-migration
          fi
